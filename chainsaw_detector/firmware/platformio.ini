; Firmware detektora piły dla XIAO ESP32-S3 (ESP-IDF + TFLite Micro).
; Model i parametry cech brane są z ../out_unified_v2 (patrz src/CMakeLists.txt).

[env]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
monitor_filters = direct

; INMP441 na I2S: SCK=D1, WS=D2, SD=D0, L/R do GND
[env:inmp441]
build_flags = -DDETECT_THRESHOLD=0.8f

; wbudowany mikrofon PDM w XIAO ESP32-S3 Sense
[env:sense]
build_flags = -DMIC_PDM -DDETECT_THRESHOLD=0.8f

; ESP32-C6, piny jak XIAO C6: SCK=D1 (GPIO1), WS=D2 (GPIO2), SD=D0 (GPIO0)
; (bez FPU i bez SIMD - czasy w logu pokażą, czy mieści się w 0,5 s)
[env:c6_inmp441]
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
build_flags = -DDETECT_THRESHOLD=0.8f -DLED_GPIO=-1 -DMIC_SCK=1 -DMIC_WS=2 -DMIC_SD=0
