[env:xiao_base]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@^7.1.0
build_flags = -DCORE_DEBUG_LEVEL=0

[env:gateway]
extends = env:xiao_base
build_flags = ${env:xiao_base.build_flags} -DNODE_ID=0

[env:node1]
extends = env:xiao_base
build_flags = ${env:xiao_base.build_flags} -DNODE_ID=1

[env:node2]
extends = env:xiao_base
build_flags = ${env:xiao_base.build_flags} -DNODE_ID=2

[env:node3]
extends = env:xiao_base
build_flags = ${env:xiao_base.build_flags} -DNODE_ID=3
